name: Deploy to Azure

# Hosting and sign-in live in different tenants:
#   - Azure resources: Ben's personal "Azure subscription 1" (AZURE_* below)
#   - User sign-in: the Pacifica Landscapes Entra tenant (ENTRA_* below)
# No secrets anywhere: GitHub signs in to Azure with OIDC (the mileage-log-github app
# trusts only this repo's main branch), and the API signs in to Postgres with its
# managed identity. Every value below is an identifier, not a credential.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'packages/**'
      - 'apps/mobile/**'
      - 'infra/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'

env:
  AZURE_CLIENT_ID: c1c509c8-1676-4338-bcc7-1f9a3431d14b
  AZURE_TENANT_ID: 6b2283e3-b75d-414f-933e-02cf1cdf6053
  AZURE_SUBSCRIPTION_ID: d308b3d9-92b1-4b1c-aba9-a7ca4b923521
  AZURE_RESOURCE_GROUP: rg-mileage-log
  # Pacifica Landscapes tenant and app registrations.
  ENTRA_TENANT_ID: 4712cd50-fdbe-47a5-b632-f5d5e5e1a61b
  ENTRA_API_CLIENT_ID: 1e605472-f866-4d4d-a242-a17e6881ccaa
  ENTRA_APP_CLIENT_ID: 8f9a2e0f-8e53-4d67-87f5-e16d4445e40a

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  infra:
    runs-on: ubuntu-latest
    outputs:
      apiName: ${{ steps.deploy.outputs.apiName }}
      apiBaseUrl: ${{ steps.deploy.outputs.apiBaseUrl }}
      webName: ${{ steps.deploy.outputs.webName }}
      webUrl: ${{ steps.deploy.outputs.webUrl }}
      keyVaultName: ${{ steps.deploy.outputs.keyVaultName }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Bicep
        id: deploy
        run: |
          outputs=$(az deployment group create \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "mileage-${{ github.run_number }}" \
            --parameters infra/main.bicepparam \
            --query properties.outputs -o json)
          for key in apiName apiBaseUrl webName webUrl keyVaultName; do
            echo "$key=$(echo "$outputs" | jq -r ".$key.value")" >> "$GITHUB_OUTPUT"
          done

  api:
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package API
        run: npm run package:api
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Functions (Flex Consumption)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.infra.outputs.apiName }}
          package: api-package
          sku: flexconsumption
          remote-build: false
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ needs.infra.outputs.apiBaseUrl }}/health"; then exit 0; fi
            sleep 15
          done
          echo "API health check failed" && exit 1

  web:
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Publish the Tesla partner public key
        # The private key is created inside Key Vault and never leaves it; Tesla reads the
        # public half from https://<site>/.well-known/appspecific/com.tesla.3p.public-key.pem
        run: |
          vault="${{ needs.infra.outputs.keyVaultName }}"
          out=apps/mobile/public/.well-known/appspecific/com.tesla.3p.public-key.pem
          mkdir -p "$(dirname "$out")"
          for i in $(seq 1 12); do   # a new role assignment can take a few minutes to apply
            if az keyvault key show --vault-name "$vault" -n tesla-partner-key -o none 2>/dev/null \
               || az keyvault key create --vault-name "$vault" -n tesla-partner-key --kty EC --curve P-256 --ops sign verify -o none; then
              az keyvault key download --vault-name "$vault" -n tesla-partner-key -e PEM -f "$out" && break
            fi
            sleep 20
          done
          grep -q "BEGIN PUBLIC KEY" "$out"
          cat "$out"
      - name: Build web app
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1
          EXPO_PUBLIC_API_URL: ${{ needs.infra.outputs.apiBaseUrl }}
          EXPO_PUBLIC_AUTH_MODE: entra
          EXPO_PUBLIC_ENTRA_TENANT_ID: ${{ env.ENTRA_TENANT_ID }}
          EXPO_PUBLIC_ENTRA_CLIENT_ID: ${{ env.ENTRA_APP_CLIENT_ID }}
          EXPO_PUBLIC_ENTRA_API_SCOPE: api://${{ env.ENTRA_API_CLIENT_ID }}/access_as_user
        run: npx expo export --platform web --output-dir dist
      - name: Get Static Web App deploy token
        id: swa
        run: |
          token=$(az staticwebapp secrets list --name "${{ needs.infra.outputs.webName }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Upload to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: apps/mobile/dist
          skip_app_build: true
      - run: echo "Web app is at ${{ needs.infra.outputs.webUrl }}"
