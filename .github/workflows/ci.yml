name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mileage
          POSTGRES_PASSWORD: mileage
          POSTGRES_DB: mileage_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mileage"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://mileage:mileage@localhost:5432/mileage_test
      - name: Build web bundle
        working-directory: apps/mobile
        run: npx expo export --platform web
        env:
          EXPO_NO_TELEMETRY: 1
      - name: Compile Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
