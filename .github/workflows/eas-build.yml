name: Mobile build (EAS)

# Needs the EXPO_TOKEN secret. Run the first iOS build interactively from a terminal
# (`npx eas-cli build -p ios --profile preview`) so EAS can create signing credentials
# with your Apple account; after that this workflow can build non-interactively.
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [ios, android, all]
        default: ios
      profile:
        type: choice
        options: [preview, development, production]
        default: preview

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run build -w @mileage/shared
      - name: Start EAS build
        working-directory: apps/mobile
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
